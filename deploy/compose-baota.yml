# 宝塔「Docker → 容器编排」表单使用的生产 Compose。
# 镜像由 GitHub Actions 推送到 GHCR；.env 内容仍由宝塔私有保存，
# /opt/douyin-cloud-streak/data 保持为宿主机持久化数据目录。

services:
  douyin-cloud-streak:
    image: ${DOCKER_IMAGE:-ghcr.io/youge12388-create/tiktok-fire:latest}
    container_name: douyin-cloud-streak
    restart: always
    init: true
    stop_grace_period: 30s
    ports:
      # 8011 已被同机的既有服务占用；Nginx 的 /douyin-fire/ 子路径反代到 8012。
      - "127.0.0.1:8012:8000"
    shm_size: 1gb
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
    volumes:
      - /opt/douyin-cloud-streak/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
