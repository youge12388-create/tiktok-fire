# 宝塔「Docker → 容器编排」表单使用的部署 Compose。
# 先将不含 .env 与 data 的源码解压至 /opt/douyin-cloud-streak，
# 再把本文件内容粘贴到表单；表单内的 .env 内容由宝塔私有保存。

services:
  douyin-cloud-streak:
    build:
      context: /opt/douyin-cloud-streak
      args:
        VITE_BASE_PATH: ${PUBLIC_BASE_PATH:-/}
    container_name: douyin-cloud-streak
    restart: always
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8011:8000"
    shm_size: 1gb
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
    volumes:
      - /opt/douyin-cloud-streak/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
