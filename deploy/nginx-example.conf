# Nginx 反向代理 + HTTPS 示例（V1 生产推荐）
# 注意事项：
#   1. Docker 只绑定 127.0.0.1:8000，公网建议只开放 80/443，切勿直接暴露 8000。
#   2. 走 HTTPS 时请把应用侧 COOKIE_SECURE 设为 true（Cookie 仅经 HTTPS 传输）。
#   3. 证书可用 certbot --nginx 或云厂商免费证书；下面路径请替换为你的证书路径。

server {
    listen 80;
    server_name your-domain.com; # 替换为你的实际域名
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/your-domain.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
