# 将本片段放在既有 HTTPS 站点的 server{} 内（宝塔可放入对应站点的 extension 目录）。
# 同时在应用 .env 中设置：
#   PUBLIC_BASE_PATH=/douyin-fire
#   SESSION_COOKIE_NAME=douyin_fire_session
#   COOKIE_SECURE=true
#
# 注意 proxy_pass 末尾的 /：它会剥离 /douyin-fire/ 前缀，保留当前后端根路由。

location = /douyin-fire {
    return 308 /douyin-fire/;
}

location ^~ /douyin-fire/ {
    proxy_pass http://127.0.0.1:8012/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 20m;
}
